name: Deploy Dragon Fury Store

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Backend – install
        run: |
          cd backend
          npm install --omit=dev

      - name: Frontend – install, lint, build
        run: |
          cd frontend
          npm install
          npm run lint
          npm run build

      - name: Admin – install, lint, build
        run: |
          cd admin
          npm install
          npm run lint
          npm run build

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e
            DEPLOY_PATH="/var/www/dragonfury-store-clone"
            MAINT_FLAG="$DEPLOY_PATH/maintenance.flag"
            ETA_FILE="$DEPLOY_PATH/frontend/maintenance/eta.json"
            DEPLOY_ETA_SECONDS="${DEPLOY_ETA_SECONDS:-300}"

            can_write() {
              if [ -e "$1" ]; then
                [ -w "$1" ]
              else
                [ -w "$(dirname "$1")" ]
              fi
            }

            enable_maintenance() {
              mkdir -p "$DEPLOY_PATH/frontend/maintenance" 2>/dev/null || sudo mkdir -p "$DEPLOY_PATH/frontend/maintenance"
              START_MS=$(($(date +%s) * 1000))
              END_MS=$((START_MS + DEPLOY_ETA_SECONDS * 1000))
              payload=$(printf '{"startedAt":%s,"endsAt":%s,"durationSec":%s}' "$START_MS" "$END_MS" "$DEPLOY_ETA_SECONDS")
              if can_write "$ETA_FILE"; then
                printf '%s\n' "$payload" > "$ETA_FILE"
              else
                printf '%s\n' "$payload" | sudo tee "$ETA_FILE" >/dev/null
              fi
              if can_write "$MAINT_FLAG"; then
                touch "$MAINT_FLAG"
              else
                sudo touch "$MAINT_FLAG"
              fi
              echo ">>> Maintenance ON (ETA ${DEPLOY_ETA_SECONDS}s)"
            }

            cleanup() {
              echo ">>> Clearing maintenance mode..."
              if [ -e "$MAINT_FLAG" ] && [ ! -w "$MAINT_FLAG" ]; then
                sudo rm -f "$MAINT_FLAG"
              else
                rm -f "$MAINT_FLAG"
              fi
              if [ -e "$ETA_FILE" ] && [ ! -w "$ETA_FILE" ]; then
                sudo rm -f "$ETA_FILE"
              else
                rm -f "$ETA_FILE"
              fi
            }
            trap cleanup EXIT

            if [ -f "$DEPLOY_PATH/frontend/maintenance/index.html" ]; then
              enable_maintenance
            fi

            cd "$DEPLOY_PATH"
            echo ">>> Pulling latest code..."
            git fetch origin
            git reset --hard origin/main

            enable_maintenance

            echo ">>> Backend..."
            cd "$DEPLOY_PATH/backend"
            if [ ! -d node_modules ] || [ package-lock.json -nt node_modules ]; then
              echo ">>> Installing backend deps..."
              npm install --omit=dev
            else
              echo ">>> Backend deps up to date, skip install"
            fi
            echo ">>> Running database migrations..."
            npm run migrate
            pm2 restart dragonfury-api --update-env || pm2 restart partner-api --update-env

            echo ">>> Frontend..."
            cd "$DEPLOY_PATH/frontend"
            if [ ! -d node_modules ] || [ package-lock.json -nt node_modules ]; then
              echo ">>> Installing frontend deps..."
              npm install
            else
              echo ">>> Frontend deps up to date, skip install"
            fi
            npm run build

            echo ">>> Admin..."
            cd "$DEPLOY_PATH/admin"
            if [ ! -d node_modules ] || [ package-lock.json -nt node_modules ]; then
              echo ">>> Installing admin deps..."
              npm install
            else
              echo ">>> Admin deps up to date, skip install"
            fi
            npm run build

            echo ">>> Done."
            pm2 status
            curl -sf -o /dev/null http://127.0.0.1:8084/api/healthcheck || true
