# Maintenance mode — copy into your EC2 nginx site and set server_name.
server {
    listen 80;
    server_name _;

    root /var/www/dragonfury-store-clone/frontend/dist;
    index index.html;

    set $maintenance 0;
    if (-f /var/www/dragonfury-store-clone/maintenance.flag) {
        set $maintenance 1;
    }

    location /maintenance/ {
        alias /var/www/dragonfury-store-clone/frontend/maintenance/;
        add_header Cache-Control "no-store" always;
    }

    location / {
        if ($maintenance = 1) {
            return 503;
        }
        try_files $uri $uri/ /index.html;
    }

    error_page 503 @maintenance;
    location @maintenance {
        root /var/www/dragonfury-store-clone/frontend;
        rewrite ^ /maintenance/index.html break;
        add_header Cache-Control "no-store" always;
    }

    location /api {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
