server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/javascript application/xml;

    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # Hashed Vite assets — long cache (safe; filenames change on build).
    # Missing files must NOT fall through to index.html (that causes
    # "text/html is not a valid javascript mime type" / failed dynamic imports).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ~* \.(webp|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Always revalidate the HTML shell so clients pick up new hashed asset URLs after deploy
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }

    # SPA pages. Exact match beats a case-insensitive wallet regex (~* Deposit vs /deposit).
    location = /deposit {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }
    location = /withdraw {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }
    location = /bonus {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }

    # GitSlotPark / 568Win POSTs at domain root. Case-sensitive so /deposit is not proxied.
    location ~ ^/(GetBalance|Withdraw|Deposit|BetWin|RollbackTransaction|Deduct|Settle|Rollback|Cancel|ReturnStake|GetBetStatus|Bonus|Tip|Transfer|RollbackTransfer|GetTransferStatus|liveCoinTransaction)$ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Crawlers need real blog HTML. The SPA shell is a Google Soft 404.
    location = /sitemap.xml {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ^~ /blog {
        error_page 418 = @blog_crawler;
        if ($http_user_agent ~* "googlebot|google-inspectiontool|google-inspection-tool|storebot-google|adsbot-google|bingbot|bingpreview|slurp|duckduckbot|baiduspider|yandex(bot|images)|facebookexternalhit|twitterbot|linkedinbot|applebot|semrushbot|ahrefsbot") {
            return 418;
        }
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }

    location @blog_crawler {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        # SPA routes serve index.html — do not long-cache HTML
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        try_files $uri $uri/ /index.html;
    }
    location /api {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
