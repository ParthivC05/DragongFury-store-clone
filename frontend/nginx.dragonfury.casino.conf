upstream dragonfury_backend {
    server 127.0.0.1:8084;
    keepalive 16;
}

########################################
# dragonfury.casino (user site + local API)
########################################
server {
    listen 443 ssl;
    server_name dragonfury.casino;

    root /var/www/dragonfury-store-clone/frontend/dist;
    index index.html;
    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    set $maintenance 0;
    if (-f /var/www/dragonfury-store-clone/maintenance.flag) {
        set $maintenance 1;
    }

    # Use $request_uri (original spelling). $uri is normalized and makes /PROMOTIONS look like /promotions.
    # Trailing slash only: /terms/ → /terms. Do not match /blog/test999 or /slots/category.
    set $public_redir "";
    if ($request_uri ~* "^/about/?(\?|$)") { set $public_redir /about; }
    if ($request_uri ~* "^/help/?(\?|$)") { set $public_redir /help; }
    if ($request_uri ~* "^/contact/?(\?|$)") { set $public_redir /contact; }
    if ($request_uri ~* "^/faq/?(\?|$)") { set $public_redir /faq; }
    if ($request_uri ~* "^/privacy/?(\?|$)") { set $public_redir /privacy; }
    if ($request_uri ~* "^/terms/?(\?|$)") { set $public_redir /terms; }
    if ($request_uri ~* "^/responsible-gaming/?(\?|$)") { set $public_redir /responsible-gaming; }
    if ($request_uri ~* "^/promotions/?(\?|$)") { set $public_redir /promotions; }
    if ($request_uri ~* "^/link2play/?(\?|$)") { set $public_redir /link2play; }
    if ($request_uri ~* "^/slots/?(\?|$)") { set $public_redir /slots; }
    if ($request_uri ~* "^/casino/?(\?|$)") { set $public_redir /casino; }
    if ($request_uri ~* "^/platform/?(\?|$)") { set $public_redir /platform; }
    if ($request_uri ~* "^/blog/?(\?|$)") { set $public_redir /blog; }
    if ($request_uri ~ "^/(about|help|contact|faq|privacy|terms|responsible-gaming|promotions|link2play|slots|casino|platform|blog)(\?|$)") {
        set $public_redir "";
    }
    if ($public_redir != "") { return 301 $public_redir$is_args$args; }

    error_page 404 /404.html;
    error_page 410 =410 /404.html;

    location = /404.html {
        add_header Cache-Control "no-store" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }

    location /maintenance/ {
        alias /var/www/dragonfury-store-clone/frontend/maintenance/;
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        if ($maintenance = 1) { return 503; }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        access_log off;
    }

    location ~* \.(webp|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        if ($maintenance = 1) { return 503; }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        access_log off;
    }

    location = /deposit { if ($maintenance = 1) { return 503; } try_files /index.html =404; add_header Cache-Control "no-cache" always; add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always; }
    location = /withdraw { if ($maintenance = 1) { return 503; } try_files /index.html =404; add_header Cache-Control "no-cache" always; add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always; }
    location = /bonus { if ($maintenance = 1) { return 503; } try_files /index.html =404; add_header Cache-Control "no-cache" always; add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always; }
    location = /blog/test { return 410; }

    location ~ ^/(GetBalance|Withdraw|Deposit|BetWin|RollbackTransaction|Deduct|Settle|Rollback|Cancel|ReturnStake|GetBetStatus|Bonus|Tip|Transfer|RollbackTransfer|GetTransferStatus|liveCoinTransaction)$ {
        proxy_pass http://dragonfury_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://dragonfury_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ^~ /api {
        proxy_pass http://dragonfury_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ^~ /socket.io/ {
        proxy_pass http://dragonfury_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Homepage: humans get SPA with no-cache. Googlebot gets backend HTML.
    location = / {
        if ($maintenance = 1) { return 503; }
        error_page 418 = @blog_crawler;
        if ($http_user_agent ~* "googlebot|google-inspectiontool|google-inspection-tool|storebot-google|adsbot-google|bingbot|bingpreview|slurp|duckduckbot|baiduspider|yandex(bot|images)|facebookexternalhit|twitterbot|linkedinbot|applebot|semrushbot|ahrefsbot") {
            return 418;
        }
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }

    location @home_crawler_or_spa {
        error_page 418 = @blog_crawler;
        if ($http_user_agent ~* "googlebot|google-inspectiontool|google-inspection-tool|storebot-google|adsbot-google|bingbot|bingpreview|slurp|duckduckbot|baiduspider|yandex(bot|images)|facebookexternalhit|twitterbot|linkedinbot|applebot|semrushbot|ahrefsbot") {
            return 418;
        }
        rewrite ^ /index.html break;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }

    location ~ ^/(about|help|contact|faq|privacy|terms|responsible-gaming|promotions|link2play|slots|casino|platform|blog)$ {
        set $df_page $1;
        if ($maintenance = 1) { return 503; }
        error_page 418 = @blog_crawler;
        error_page 419 = @public_seo;
        if ($http_user_agent ~* "googlebot|google-inspectiontool|google-inspection-tool|storebot-google|adsbot-google|bingbot|bingpreview|slurp|duckduckbot|baiduspider|yandex(bot|images)|facebookexternalhit|twitterbot|linkedinbot|applebot|semrushbot|ahrefsbot") {
            return 418;
        }
        return 419;
    }

    location @public_seo {
        try_files /$df_page/index.html /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }

    location ~ ^/blog/([^/]+)/?$ {
        if ($maintenance = 1) { return 503; }
        proxy_pass http://dragonfury_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_intercept_errors on;
        error_page 404 /404.html;
        error_page 410 =410 /404.html;
    }

    location ^~ /tiles/ { if ($maintenance = 1) { return 503; } try_files $uri =404; add_header Cache-Control "public, max-age=2592000" always; add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always; }
    location ^~ /play/ { if ($maintenance = 1) { return 503; } try_files /index.html =404; add_header Cache-Control "no-cache" always; add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always; }
    location ^~ /games/ { if ($maintenance = 1) { return 503; } try_files /index.html =404; add_header Cache-Control "no-cache" always; add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always; }
    location ^~ /casino/ { if ($maintenance = 1) { return 503; } try_files /index.html =404; add_header Cache-Control "no-cache" always; add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always; }
    location ^~ /slots/ { if ($maintenance = 1) { return 503; } try_files /index.html =404; add_header Cache-Control "no-cache" always; add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always; }
    location ^~ /account/ { if ($maintenance = 1) { return 503; } try_files /index.html =404; add_header Cache-Control "no-cache" always; add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always; }
    location ^~ /pages/ { if ($maintenance = 1) { return 503; } try_files /index.html =404; add_header Cache-Control "no-cache" always; add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always; }
    location ^~ /auth/ { if ($maintenance = 1) { return 503; } try_files /index.html =404; add_header Cache-Control "no-cache" always; add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always; }
    location ^~ /kyc/ { if ($maintenance = 1) { return 503; } try_files /index.html =404; add_header Cache-Control "no-cache" always; add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always; }
    location ^~ /deposit/ { if ($maintenance = 1) { return 503; } try_files /index.html =404; add_header Cache-Control "no-cache" always; add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always; }
    location ^~ /support/ { if ($maintenance = 1) { return 503; } try_files /index.html =404; add_header Cache-Control "no-cache" always; add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always; }

    location ~ ^/(login|signin|register|signup|verify-email|check-email|forgot-password|reset-password|games|withdraw|bonus|spinwheel|daily-bonus|settings|cashapp|platforms|testbona|download|account|store|redeem|install|vip|refer|claim-offer|firekirin-exclusive)$ {
        if ($maintenance = 1) { return 503; }
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }

    location @blog_crawler {
        proxy_pass http://dragonfury_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location @serve_spa {
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        rewrite ^ /index.html break;
    }

    location @googlebot_not_found {
        return 404;
    }

    location / {
        if ($maintenance = 1) { return 503; }
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }

    error_page 503 @maintenance;
    location @maintenance {
        root /var/www/dragonfury-store-clone/frontend;
        rewrite ^ /maintenance/index.html break;
        add_header Cache-Control "no-store" always;
    }

    ssl_certificate /etc/letsencrypt/live/dragonfury.casino/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dragonfury.casino/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = dragonfury.casino) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name dragonfury.casino;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://dragonfury.casino$request_uri; }
}

