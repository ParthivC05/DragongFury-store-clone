    server_name admin.dragonfury.casino;

    root /var/www/dragonfury-store-clone/admin/dist;
    index index.html;
    client_max_body_size 20m;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location ^~ /api {
        proxy_pass http://dragonfury_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ^~ /socket.io/ {
        proxy_pass http://dragonfury_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    ssl_certificate /etc/letsencrypt/live/admin.dragonfury.casino/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.dragonfury.casino/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name admin.dragonfury.casino;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://admin.dragonfury.casino$request_uri; }
}
